name: Deploy USTaxes NextGen 2.0 Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - run: npm ci
      - name: Verify independent NextGen 2.0 application entry
        run: node tools/nextgen-standalone-gate.js
      - name: Architecture regression tests
        run: npm run nextgen:test && node platform/tests/integration.js
      - name: Build for repository subpath
        env:
          CI: 'false'
          REACT_APP_GITHUB_PAGES: 'true'
          PUBLIC_URL: /USTaxes-NextGen
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
