name: NextGen 2025 validation (non-filing)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/nextgen/**'
      - 'tools/**'
      - 'platform/**'
      - 'package*.json'
      - 'scripts/**'
      - 'craco.config.js'
      - 'tsconfig.json'
      - '.github/workflows/nextgen-validation.yml'
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - name: Audit npm lockfile before install
        run: npm run audit:lockfile && node tools/stage79-lockfile-audit.test.js
      - name: Verify shipped IRS 2025 runtime tax table against source CSV
        run: npm run audit:2025:runtime-table
      - name: Install locked dependencies
        id: npm_install
        run: |
          set -o pipefail
          mkdir -p test-results
          npm ci --no-audit --no-fund 2>&1 | tee test-results/npm-ci.log
      - name: Dependency preflight
        run: npm run preflight:build:strict
      - name: Offline-capable architecture tests
        run: npm run nextgen:test
      - name: Presentation regression (local TypeScript)
        run: node tools/stage71-presentation-regression.js
      - name: Stage 77 workflow safeguards
        run: node tools/stage77-ci-safeguards.test.js
      - name: Form 1040 integration regression (local TypeScript)
        id: integration_regression
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:integration:2025 2>&1 | tee test-results/integration.log
      - name: NextGen 2025 Jest tests
        id: jest_2025
        env:
          CI: 'true'
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:nextgen:2025 2>&1 | tee test-results/jest.log
      # React Scripts treats ESLint warnings as build failures when CI=true.
      # Match the already successful GitHub Pages build policy; preserve
      # warnings in react-build.log for follow-up remediation.
      - name: Compile React application
        id: react_build
        env:
          CI: 'false'
          NODE_OPTIONS: --openssl-legacy-provider
          REACT_APP_GITHUB_PAGES: 'true'
          PUBLIC_URL: /USTaxes-NextGen
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run build 2>&1 | tee test-results/react-build.log
      - name: Summarize CI outcomes (including skipped steps)
        if: always()
        run: |
          node tools/stage82-ci-summary.js test-results \
            npm-ci=${{ steps.npm_install.outcome }} \
            integration=${{ steps.integration_regression.outcome }} \
            jest=${{ steps.jest_2025.outcome }} \
            react-build=${{ steps.react_build.outcome }}
      - name: Enforce Stage 83 CI completion gate
        if: always()
        run: node tools/stage83-ci-release-gate.js test-results/stage82-summary.json
      - name: Preserve build diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage80-validation-artifacts
          retention-days: 14
          path: |
            build/
            npm-debug.log
            npm-debug*.log
            coverage/
            test-results/
          if-no-files-found: ignore
